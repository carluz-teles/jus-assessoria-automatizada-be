# sqlc — geração de código type-safe a partir do SQL.
# Ref: https://docs.sqlc.dev (config v2, pgx/v5).
#
# Vertical slice: cada slice tem seu PRÓPRIO pacote gerado — logo, um bloco por
# slice em `sql:` abaixo. O schema é compartilhado (migrations/, fonte de verdade
# do banco em docs/erd-modelo-de-dados.md); as queries são por-slice
# (internal/<slice>/queries). Ao criar um slice novo, copie o bloco-modelo.
#
# sqlc lê o diretório de migrations e IGNORA os arquivos *.down.sql (convenção
# golang-migrate), aplicando só os *.up.sql para montar o catálogo.
version: "2"
sql:
  # ── identity (Slice 10): tenant + app_user ──────────────────────────────────
  - engine: "postgresql"
    schema: "migrations"
    queries: "internal/identity/queries"
    gen:
      go:
        package: "identitydb"
        out: "internal/identity/identitydb"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_json_tags: true
        emit_pointers_for_null_types: true
        overrides:
          # uuid é o tipo de todas as PKs/FKs — mapeia para google/uuid.UUID
          # (o mapper do slice o converte para string na fronteira da entidade).
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"

  # ── acquisition (Slice): integration ────────────────────────────────────────
  - engine: "postgresql"
    schema: "migrations"
