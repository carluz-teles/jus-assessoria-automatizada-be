name: Terraform

# erd-infraestrutura §5: provisionar != publicar, and apply is a human decision.
#   - PR touching infra/terraform/** -> fmt + init (-backend=false) + validate only,
#     no cloud credentials required, nothing provisioned.
#   - workflow_dispatch (manual) -> real init against Terraform Cloud + apply, gated by
#     the `prod` GitHub Environment (required reviewers in Settings -> Environments).
# State lives in Terraform Cloud (empty `cloud {}` block; org/workspace via env).
# Object storage is a Cloudflare R2 bucket created MANUALLY in the R2 dashboard — the
# S3_* vars below are R2 credentials injected into the Railway services, not AWS.
# Secrets live in GitHub Actions Secrets; TF_CLOUD_ORGANIZATION/TF_WORKSPACE are repo
# Variables (non-secret). Never hardcoded in code.
on:
  pull_request:
    paths:
      - 'infra/terraform/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Terraform Cloud auth + config. TF_API_TOKEN is a secret (a TFC user/team API token);
  # the org/workspace are repo Variables, not secrets. Only the apply job contacts TFC.
  TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
  TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
  TF_WORKSPACE: ${{ vars.TF_WORKSPACE }}

  # GH Actions Secrets -> TF_VAR_* for the SENSITIVE variables (no defaults in
  # variables.tf). Only ${{ secrets.* }} references — never hardcoded values.
  # The S3_* set now holds Cloudflare R2 credentials (no AWS anywhere).
  TF_VAR_railway_token: ${{ secrets.RAILWAY_TOKEN }}
  TF_VAR_clerk_secret_key: ${{ secrets.CLERK_SECRET_KEY }}
  TF_VAR_clerk_webhook_secret: ${{ secrets.CLERK_WEBHOOK_SECRET }}
  TF_VAR_clerk_issuer: ${{ secrets.CLERK_ISSUER }}
  TF_VAR_anthropic_key: ${{ secrets.ANTHROPIC_API_KEY }}
  TF_VAR_otel_endpoint: ${{ secrets.OTEL_ENDPOINT }}
  TF_VAR_postgres_password: ${{ secrets.POSTGRES_PASSWORD }}
  TF_VAR_s3_endpoint: ${{ secrets.S3_ENDPOINT }}
  TF_VAR_s3_region: ${{ secrets.S3_REGION }}
  TF_VAR_s3_bucket: ${{ secrets.S3_BUCKET }}
  TF_VAR_s3_access_key: ${{ secrets.S3_ACCESS_KEY }}
  TF_VAR_s3_secret_key: ${{ secrets.S3_SECRET_KEY }}

jobs:
  validate:
    name: Validate (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform -chdir=infra/terraform fmt -check -recursive

      # No cloud credentials on PRs: -backend=false skips Terraform Cloud entirely,
      # so init + validate run offline and provision nothing.
      - name: Terraform init (no backend)
        run: terraform -chdir=infra/terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform -chdir=infra/terraform validate

  apply:
    name: Apply (manual, gated)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # The `prod` Environment protection rule (required reviewers) IS the approval
    # gate — that is why no -auto-approve is used anywhere below.
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      # Non-secret prod sizing lives in prod.tfvars (gitignored); only the
      # .example is committed. Materialize it for CI if absent.
      - name: Prepare prod.tfvars
        run: |
          cd infra/terraform/environments
          [ -f prod.tfvars ] || cp prod.tfvars.example prod.tfvars

      # Real init: authenticates to Terraform Cloud via TF_TOKEN_app_terraform_io and
      # binds the state to TF_CLOUD_ORGANIZATION / TF_WORKSPACE.
      - name: Terraform init
        run: terraform -chdir=infra/terraform init -input=false

      - name: Terraform plan
        run: |
          terraform -chdir=infra/terraform plan -input=false -lock-timeout=5m \
            -var-file=environments/prod.tfvars \
            -var image_registry=ghcr.io/${{ github.repository_owner }} \
            -var image_tag=${{ github.sha }} \
            -out=tfplan

      # Applies the reviewed plan — no -auto-approve; the Environment gate approved it.
      - name: Terraform apply
        run: terraform -chdir=infra/terraform apply -input=false -lock-timeout=5m tfplan
