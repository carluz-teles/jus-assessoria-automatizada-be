name: Pipeline

# Um pipeline gated: test -> build -> deploy (encadeado por `needs`). Teste vermelho
# BLOQUEIA o build; o deploy só roda depois que as 6 imagens sobem. `test` roda em todo
# push e PR (green gate em qualquer branch); `build` e `deploy` só no main (build também
# em tags de versão). Terraform é outro ciclo (terraform.yml).
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build, test & vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      # Advisory only — never blocks the pipeline.
      - name: golangci-lint (advisory)
        continue-on-error: true
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  build:
    name: Build & push ${{ matrix.svc }}
    # Gate: só builda se o test passou, e só no main / tags de versão.
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        svc: [api, worker-ingestao, worker-documents, worker-ai, worker-outbox-relay, scheduler]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.svc }}
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            SVC=${{ matrix.svc }}
          push: true
          # github.repository_owner já é lowercase neste repo (GHCR exige lowercase).
          tags: |
            ghcr.io/${{ github.repository_owner }}/jus-${{ matrix.svc }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/jus-${{ matrix.svc }}:latest
          cache-from: type=gha,scope=${{ matrix.svc }}
          cache-to: type=gha,mode=max,scope=${{ matrix.svc }}

  deploy:
    name: Redeploy on Railway
    # Gate: só depois das 6 imagens, e só no main (tags não deployam).
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trigger Railway redeploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          PROJECT_NAME: court-legal
        run: bash infra/railway/redeploy.sh
