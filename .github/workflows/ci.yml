name: CI

# Go green gate (CLAUDE.md): build + test + vet must be 0 on every PR and push.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test-vet:
    name: Build, test & vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      # Advisory only — never blocks the green gate.
      - name: golangci-lint (advisory)
        continue-on-error: true
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m
