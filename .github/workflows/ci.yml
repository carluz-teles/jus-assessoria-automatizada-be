name: CI

# Green gate REUTILIZÁVEL: roda sozinho em PR e pode ser chamado por qualquer workflow
# (o cd.yml chama via `uses`). Não precisa de secret nenhum (integração usa testcontainers).
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (gofmt + vet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      # gofmt é gate determinístico (zero-config). golangci-lint fica advisory.
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Arquivos não formatados (rode gofmt -w):"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: golangci-lint (advisory)
        continue-on-error: true
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  test:
    name: Build & test
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...
      # Integração (//go:build integration): sobe Postgres via testcontainers; o runner
      # ubuntu-latest tem Docker. Cobre RLS, outbox atômico, gating — o que `go test` pula.
      - name: Integration tests
        run: go test -tags=integration ./...
