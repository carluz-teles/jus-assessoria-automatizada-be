name: CD

# Só no push da main (build também em tags de versão). Reusa o MESMO green gate do ci.yml,
# depois build+push das imagens e deploy via Terraform. Ordem: ci → build → PUSH → deploy
# (push ANTES do deploy: a Railway PUXA a imagem :sha do GHCR; se não existir, o deploy falha).
on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  # 1) Green gate — reusa o ci.yml (uma fonte de verdade, zero duplicação).
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # 2) Build & push das 6 imagens de app, tag :sha (versionado) + :latest.
  build:
    name: Build & push ${{ matrix.svc }}
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        svc: [api, worker-ingestao, worker-documents, worker-ai, worker-outbox-relay, scheduler]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push ${{ matrix.svc }}
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: SVC=${{ matrix.svc }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/jus-${{ matrix.svc }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/jus-${{ matrix.svc }}:latest
          cache-from: type=gha,scope=${{ matrix.svc }}
          cache-to: type=gha,mode=max,scope=${{ matrix.svc }}

  # 3) Deploy: apply.sh (converge-loop) fixando a imagem no SHA deste commit. Só na main.
  deploy:
    name: Deploy (terraform apply)
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      # Backend de state (Terraform Cloud)
      TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}   # = Autojus
      TF_WORKSPACE: autojus-terraform
      # Railway
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_WORKSPACE_ID: ${{ vars.RAILWAY_WORKSPACE_ID }}
      IMAGE_TAG: ${{ github.sha }}
      IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
      # App secrets (as MESMAS do provision.sh + billing/notifications)
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_WEBHOOK_SECRET: ${{ secrets.CLERK_WEBHOOK_SECRET }}
      CLERK_ISSUER: ${{ vars.CLERK_ISSUER }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_ENDPOINT }}
      OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_HEADERS }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      STRIPE_TRIAL_DAYS: ${{ vars.STRIPE_TRIAL_DAYS }}
      APP_BILLING_SUCCESS_URL: ${{ vars.APP_BILLING_SUCCESS_URL }}
      APP_BILLING_CANCEL_URL: ${{ vars.APP_BILLING_CANCEL_URL }}
      APP_BILLING_RETURN_URL: ${{ vars.APP_BILLING_RETURN_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM_EMAIL: ${{ vars.RESEND_FROM_EMAIL }}
      RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
      DJEN_PROXY_URL: ${{ secrets.DJEN_PROXY_URL }}
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_REGION: ${{ secrets.S3_REGION }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.15.8'   # casa com a versão do state no TFC
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
      - name: terraform apply (converge-loop, IMAGE_TAG=sha)
        run: bash infra/terraform/apply.sh
