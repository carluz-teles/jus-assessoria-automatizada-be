name: Build & push images

# Slice 15: the parameterized Dockerfile (ARG SVC) yields one lean image per
# service. Publish all six to GHCR on main and on version tags. This is
# "publicar" (erd-infraestrutura §5, provisionar != publicar); Terraform then
# points services at these tags via image_tag=<sha> (see terraform.yml).
on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    name: Build & push ${{ matrix.svc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        svc: [api, worker-ingestao, worker-documents, worker-ai, worker-outbox-relay, scheduler]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.svc }}
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            SVC=${{ matrix.svc }}
          push: true
          # github.repository_owner is already lowercase for this repo (GHCR requires lowercase).
          tags: |
            ghcr.io/${{ github.repository_owner }}/jus-${{ matrix.svc }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/jus-${{ matrix.svc }}:latest
          cache-from: type=gha,scope=${{ matrix.svc }}
          cache-to: type=gha,mode=max,scope=${{ matrix.svc }}
