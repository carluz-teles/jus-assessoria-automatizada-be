# Dev stack (docs/erd-backend.md §5d): each app service builds its OWN lean image
# from the one parameterized Dockerfile (build arg SVC → jus-<svc>:local), and
# compose provides Postgres + Redis around them. `docker compose up` brings up the
# full local stack. Each image's ENTRYPOINT is its own binary — there is no
# `command:` to override (the Railway provider can't set one), so what you run
# locally is exactly what Railway runs, killing "works on my machine".

name: jus-assessoria

# In-network addresses for the deps. Set as `environment` (which overrides
# env_file) so the same .env — whose defaults point at localhost for host runs —
# also works inside compose, where the deps are reachable by service name.
x-net-env: &net-env
  DATABASE_URL: postgres://jus:jus@postgres:5432/jusassessoria?sslmode=disable
  REDIS_URL: redis://redis:6379/0
  # Object storage (dev): MinIO no compose. Prod sobrescreve via env pra R2 real.
  S3_ENDPOINT: http://minio:9000
  S3_REGION: us-east-1
  S3_BUCKET: jus-assessoria-dev
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin
  S3_USE_PATH_STYLE: "true"
  # PAdES-T em dev: freetsa.org é grátis, sem auth, e o BR aceita. Se cair, o
  # api segue funcionando com PAdES-BASIC (esta var pode ficar vazia).
  TSA_URL: http://freetsa.org/tsr

# Both deps healthy before any app container starts.
x-deps-healthy: &deps-healthy
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy

# Shared shape for the workers and scheduler: same env, same dependencies. Each
# service still declares its own `build.args.SVC` and `image` tag — one lean
# image per binary.
x-worker: &worker
  env_file: .env
  environment: *net-env
  depends_on: *deps-healthy
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: jus
      POSTGRES_PASSWORD: jus
      POSTGRES_DB: jusassessoria
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jus -d jusassessoria"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Object storage local S3-compatível para dev. Prod usa Cloudflare R2 real
  # (mesmo cliente aws-sdk-go-v2). Sem MinIO, o slice certificate (upload de
  # .pfx) fica 503 — todo endpoint que depende de storage sobe mas retorna
  # "storage não configurado". O bucket é criado no boot pelo minio-init.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console web (http://localhost:9001)
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local 2>/dev/null || curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot init: cria o bucket dev (idempotente) e sai. Sem healthcheck (short-lived).
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/jus-assessoria-dev;
      exit 0;
      "

  # The api is the only service that migrates at boot.
  api:
    build:
      context: .
      # runtime-chromium: pdfgen/html.go chama Chromium headless via chromedp
      # pra renderizar HTML→PDF na assinatura. Sem esse target, cai no
      # distroless default (sem exec) e o sign() falha 500 "google-chrome
      # not found in $PATH".
      target: runtime-chromium
      args:
        SVC: api
    image: jus-api:local
    env_file: .env
    environment:
      <<: *net-env
      # ADC dentro do container aponta pra /run/secrets/gcp-kms.json (montado
      # abaixo). O host var GOOGLE_APPLICATION_CREDENTIALS aponta pra ~/.../json
      # local; o volume mapeia esse arquivo pro path canônico dentro do container
      # e reescreve a var pro caminho interno. Se não houver JSON local (dev sem
      # KMS setup), o mount silenciosamente falha e o slice cert não sobe.
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp-kms.json
    volumes:
      # Read-only, mount de arquivo único. O ${GOOGLE_APPLICATION_CREDENTIALS:-/dev/null}
      # deixa o compose subir mesmo sem a var setada (mapeia /dev/null → arquivo
      # inexistente-porém-válido; api lê e falha, então o slice cert fica desmontado).
      - ${GOOGLE_APPLICATION_CREDENTIALS:-/dev/null}:/run/secrets/gcp-kms.json:ro
    ports:
      - "8080:8080"
    depends_on: *deps-healthy
    restart: unless-stopped

  worker-ingestao:
    <<: *worker
    build:
      context: .
      args:
        SVC: worker-ingestao
    image: jus-worker-ingestao:local

  worker-documents:
    <<: *worker
    build:
      context: .
      # Needs the OCR toolchain (pdftoppm + tesseract) → the Debian runtime-ocr stage,
      # not the default distroless runtime the other services use.
      target: runtime-ocr
      args:
        SVC: worker-documents
    image: jus-worker-documents:local

  worker-ai:
    <<: *worker
    build:
      context: .
      args:
        SVC: worker-ai
    image: jus-worker-ai:local

  worker-outbox-relay:
    <<: *worker
    build:
      context: .
      args:
        SVC: worker-outbox-relay
    image: jus-worker-outbox-relay:local

  scheduler:
    <<: *worker
    build:
      context: .
      args:
        SVC: scheduler
    image: jus-scheduler:local

volumes:
  pgdata:
  miniodata:
